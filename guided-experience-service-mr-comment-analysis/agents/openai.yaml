interface:
  display_name: "Guided Experience MR Comment Analysis"
  short_description: "Analyze MR comments and write per-comment reports"
  default_prompt: "Use this skill to fetch a guided-experience-service merge request with glab, read its comments, skip resolved comments, split actionable unresolved comments into work_plan_mr_<MR>.md with MR/comment/analysis links, a short proposed solution statement, and whether you have already replied and are waiting for feedback from the comment author, analyze each comment with repository-technical-analysis plus guided-experience-service-technical-analysis, write one Markdown analysis file per comment including the relevant MR comment link and reply/waiting status, and finish with a short screen summary."
