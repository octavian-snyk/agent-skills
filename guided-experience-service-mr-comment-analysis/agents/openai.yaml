interface:
  display_name: "Guided Experience MR Comment Analysis"
  short_description: "Analyze MR comments and write per-comment reports"
  default_prompt: "Use this skill to fetch a guided-experience-service merge request with glab, read its comments, skip resolved comments, group similar unresolved comments by issue in work_plan_mr_<MR>.md, preserve the full plan history instead of only the latest snapshot, record MR/comment/analysis links plus a short proposed solution statement and whether you have already replied and are waiting for feedback from the comment author, analyze each grouped issue with repository-technical-analysis plus guided-experience-service-technical-analysis, then in each worker run guided-experience-service-contributor sequentially to update that worker's analysis file with proposed changes, remove stale analysis/report files from previous runs for the same MR, and finish with a short screen summary."
