interface:
  display_name: "Guided Experience MR Comment Analysis"
  short_description: "Analyze MR comments and write per-comment reports"
  default_prompt: "Use this skill to fetch a guided-experience-service merge request with glab, read its comments, skip resolved comments, group similar unresolved comments under ## Grouped unresolved comments inside review_mr_<MR>.md (or analysis_mr_<MR>.md when that file is the working artifact) with stable ### issue_* subsections, preserve history inside those subsections instead of only the latest snapshot, record MR/comment links plus proposed solution notes and whether you have already replied and are waiting for feedback from the comment author, analyze each grouped subsection with repository-technical-analysis plus guided-experience-service-technical-analysis, then run guided-experience-service-contributor sequentially to update that same subsection with proposed changes, merge or delete stale legacy split artifacts from older workflows when present, and finish with a short screen summary pointing at the single main artifact path."
